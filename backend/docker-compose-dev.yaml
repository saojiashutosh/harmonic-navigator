name: harmonic-navigator-dev

# Full local stack for development: Django (dev) + a local Redis + a local
# Postgres. Mirrors production wiring but everything runs on your machine.
#   docker-compose -f docker-compose-dev.yaml up --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command:
      - /bin/sh
      - -c
      - |
        set -e

        # Local Postgres starts empty, so apply migrations on every startup.
        # migrate is idempotent — it no-ops once the schema is in place.
        echo "Applying database migrations..."
        python manage.py migrate --no-input

        echo "Checking whether full-DB bootstrap is needed..."
        if python manage.py shell -c "from tracks.models import Track; raise SystemExit(0 if Track.objects.exists() else 1)"; then
          echo "Tracks already exist, skipping Excel import."
        elif [ -f /app/data/full_db_export.xlsx ]; then
          echo "Bootstrapping entire DB from full_db_export.xlsx..."
          python scripts/import_db_from_excel.py /app/data/full_db_export.xlsx
        else
          echo "No tracks found, importing tracks-only Excel workbook..."
          python manage.py import_from_excel /app/data/harmonic_export.xlsx --no-color
        fi
        echo "Syncing mood questions..."
        python manage.py sync_mood_questions --no-color
        exec python manage.py runserver 0.0.0.0:8000
    env_file:
      - ./.env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.development
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      # --- Local PostgreSQL (the "db" service below) ---
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_SSL_MODE: disable
      IMPORT_TRACKS_ON_STARTUP: ${IMPORT_TRACKS_ON_STARTUP:-auto}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
