name: harmonic-navigator

# Production-parity stack. Builds the same image HF Spaces builds (Dockerfile)
# and talks to the MANAGED services — Neon (Postgres) and Upstash (Redis) — via
# .env.prod. No local db/redis containers: this is for verifying the prod image
# locally before pushing to Hugging Face.
#   docker-compose up --build      (reads ./.env.prod — see .env.prod.example)

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env.prod
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      # Daphne binds $PORT (default 7860). Mapped to localhost:7860 below.
      PORT: 7860
    ports:
      - "7860:7860"
